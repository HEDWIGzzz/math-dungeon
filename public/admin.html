<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Dungeon - Teacher Dashboard</title>
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap');
body {
    margin: 0; padding: 20px; font-family: 'Kanit', sans-serif;
    background: #070a14; color: #fff; display: flex; justify-content: center;
}
.dashboard {
    width: 100%; max-width: 600px; background: rgba(12, 17, 33, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
h1 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 24px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
input {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155;
    background: #03050a; color: white; font-family: 'Kanit'; font-size: 16px;
    box-sizing: border-box; outline: none;
}
input:focus { border-color: #38bdf8; }
.btn {
    width: 100%; padding: 14px; border-radius: 10px; border: 0;
    background: linear-gradient(135deg, #6366f1, #06b6d4); color: white;
    font-weight: 600; font-size: 16px; font-family: 'Kanit'; cursor: pointer;
    margin-top: 10px; transition: 0.2s;
}
.btn:hover { filter: brightness(1.15); }
.toast {
    background: #10b981; color: white; padding: 12px; border-radius: 8px;
    text-align: center; margin-bottom: 16px; display: none; font-weight: bold;
}
</style>
</head>
<body>

<div class="dashboard">
    <h1>ตั้งค่ารหัสผ่านดันเจี้ยน (Admin)</h1>
    <div id="toast" class="toast">บันทึกรหัสผ่านสำเร็จ!</div>
    
    <div class="form-group">
        <label>ฐานที่ 1: ประตูแห่งสมการ</label>
        <input type="text" id="code1" placeholder="เช่น 1234 หรือ answer1">
    </div>
    <div class="form-group">
        <label>ฐานที่ 2: วงกตแห่งตัวเลข</label>
        <input type="text" id="code2" placeholder="กำหนดรหัสผ่าน...">
    </div>
    <div class="form-group">
        <label>ฐานที่ 3: หอคอยตรรกะ</label>
        <input type="text" id="code3" placeholder="กำหนดรหัสผ่าน...">
    </div>
    <div class="form-group">
        <label>ฐานที่ 4: ถ้ำเรขาคณิต</label>
        <input type="text" id="code4" placeholder="กำหนดรหัสผ่าน...">
    </div>
    <div class="form-group">
        <label>ฐานที่ 5: วิหารคณิตศาสตร์</label>
        <input type="text" id="code5" placeholder="กำหนดรหัสผ่าน...">
    </div>

    <button class="btn" onclick="saveCodes()">💾 บันทึกรหัสผ่าน</button>
</div>

<script>
    const socket = io();

    // ดึงรหัสผ่านปัจจุบันจากเซิร์ฟเวอร์มาแสดง
    socket.emit('requestAdminCodes');
    socket.on('currentAdminCodes', codes => {
        if(codes) {
            document.getElementById('code1').value = codes[1] || '';
            document.getElementById('code2').value = codes[2] || '';
            document.getElementById('code3').value = codes[3] || '';
            document.getElementById('code4').value = codes[4] || '';
            document.getElementById('code5').value = codes[5] || '';
        }
    });

    function saveCodes() {
        const newCodes = {
            1: document.getElementById('code1').value.trim(),
            2: document.getElementById('code2').value.trim(),
            3: document.getElementById('code3').value.trim(),
            4: document.getElementById('code4').value.trim(),
            5: document.getElementById('code5').value.trim(),
        };
        socket.emit('updateAdminCodes', newCodes);
        
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }
</script>
</body>
</html>
