<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MATH DUNGEON — Shared Open World</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#050814; --panel:#0e1628; --panel2:#131f38; --line:#24365c;
  --text:#f0f5ff; --muted:#8ba2cc; --cyan:#38dbff; --purple:#8264ff;
  --gold:#ffd15c; --green:#2fe69b; --red:#ff5277; --shadow:0 20px 60px rgba(0,0,0,.6);
}
*{ box-sizing:border-box; user-select:none; }
body{
  margin:0; min-height:100vh; color:var(--text); font-family:Inter,Segoe UI,Tahoma,system-ui,sans-serif;
  background:#03050c; overflow:hidden;
}
button,input{ font:inherit; }
button{ cursor:pointer; border:0; }
.app{ min-height:100vh; display:flex; flex-direction:column; height:100vh; }
.hidden{ display:none!important; }

.topbar{
  position:absolute; top:0; left:0; right:0; z-index:50; display:flex; justify-content:space-between; align-items:center;
  padding:12px 24px; background:rgba(5,8,20,.85); backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{ display:flex; align-items:center; gap:12px; font-weight:900; font-size:18px; }
.brand-logo{ width:36px; height:36px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(135deg,#1f3566,#0c1630); border:1px solid #3c5b9c; }

.world-container{ flex:1; position:relative; overflow:hidden; display:flex; justify-content:center; align-items:center; }
canvas{ display:block; background:#070d1c; }

.hud-bar{
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%); z-index:40;
  display:flex; gap:12px; background:rgba(14,22,40,.92); border:1px solid rgba(86,120,173,.3);
  padding:12px 20px; border-radius:18px; backdrop-filter:blur(12px); box-shadow:var(--shadow); align-items:center; flex-wrap:wrap;
}
.token-slot{
  width:40px; height:40px; border-radius:10px; background:#070d1c; border:2px dashed #3a558c;
  display:grid; place-items:center; font-weight:900; font-size:16px; color:var(--cyan); position:relative;
}
.token-slot.filled{ border-style:solid; border-color:var(--cyan); background:#142952; }
.badge-count{ position:absolute; top:-6px; right:-6px; background:var(--gold); color:#2b2000; font-size:10px; font-weight:900; padding:2px 5px; border-radius:999px; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(3,5,12,.85); backdrop-filter:blur(10px);
  z-index:100; display:grid; place-items:center; padding:20px;
}
.modal-box{
  width:min(600px, 100%); background:linear-gradient(180deg, #10192e, #0a1122);
  border:1px solid rgba(56,219,255,.3); border-radius:24px; padding:32px; box-shadow:var(--shadow); text-align:center;
}
.equation-workspace{ display:flex; gap:10px; justify-content:center; align-items:center; margin:20px 0; padding:16px; background:#050914; border-radius:16px; border:1px solid #22365e; }
.eq-cell{ width:50px; height:60px; border-radius:10px; background:#0c152a; border:2px solid #3c5b9c; display:grid; place-items:center; font-size:24px; font-weight:900; color:var(--gold); cursor:pointer; }

.login-wrap{ min-height:100vh; display:grid; place-items:center; padding:24px; width:100%; }
.card{ background:linear-gradient(180deg, rgba(16,25,46,.95), rgba(10,16,30,.95)); border:1px solid rgba(86,120,173,.2); border-radius:20px; box-shadow:var(--shadow); }
.login-box{ width:min(440px, 100%); padding:36px; text-align:center; }
.field{ margin-bottom:16px; text-align:left; }
.field label{ display:block; font-size:12px; color:#8ea2c9; margin-bottom:6px; font-weight:700; }
input{ width:100%; padding:12px 14px; color:var(--text); background:#070d1c; border:1px solid #273b61; border-radius:12px; outline:none; }
.btn{ padding:12px 20px; border-radius:12px; font-weight:900; transition:.18s; }
.btn.primary{ color:white; background:linear-gradient(90deg,#7055ff,#38dbff); box-shadow:0 8px 25px rgba(56,219,255,.2); width:100%; }
.toast{ position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(100px); padding:14px 24px; border-radius:999px; background:#0d182e; border:1px solid #38dbff; color:white; font-weight:800; z-index:200; transition:.3s; }
.toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
"use strict";

const socket = io();

let myId = null;
let players = {};
let tokens = [];
let gates = [];
let inventory = { '3': 0, 'x': 0, '+': 0, '=': 0, '8': 0, '2': 0, '6': 0 };
let activeGate = null;
let playerWorkspace = ['', '', '', '', ''];

let player = { x: 500, y: 400, speed: 4 };
let keys = {};

socket.on('initWorld', data => {
  myId = data.id;
  tokens = data.tokens;
  gates = data.gates;
  players = data.players;
});

socket.on('updatePlayers', serverPlayers => {
  players = serverPlayers;
});

socket.on('playerJoined', p => {
  showToast(`👋 เพื่อนร่วมชั้น ${p.name} เข้าสู่ Open World แล้ว!`);
});

socket.on('tokenCollected', data => {
  tokens = tokens.filter(t => t.id !== data.tokenId);
  if(data.playerId === myId) {
    inventory[data.tokenVal] = (inventory[data.tokenVal] || 0) + 1;
    showToast(`✨ เก็บเบี้ยสัญลักษณ์ [ ${data.tokenVal} ] สำเร็จ!`);
  }
});

socket.on('spawnToken', newToken => {
  tokens.push(newToken);
});

socket.on('gateSolved', data => {
  gates.forEach(g => { if(g.id === data.gateId) g.solved = true; });
  players = data.players;
  showToast(`🎉 มีผู้เล่นแก้สมการผ่าน Base สำเร็จแล้ว!`);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('show'), 10);
  clearTimeout(t.timer);
  t.timer = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.classList.add('hidden'), 300);
  }, 2500);
}

function render() {
  const app = document.getElementById('app');
  if(!app) return;

  if(!players[myId] || players[myId].name === 'Guest') {
    app.innerHTML = `
      <div class="login-wrap">
        <div class="card login-box">
          <div style="font-size:42px; margin-bottom:12px;">🌍</div>
          <h2>Math Dungeon Open World</h2>
          <div style="font-size:13px; color:var(--muted); margin-bottom:20px;">ลงแมพเดียวกัน เดินเก็บเบี้ยสัญลักษณ์เพื่อสร้างสมการ</div>
          <div class="field">
            <label>ชื่อผู้เล่น</label>
            <input id="nameInput" maxlength="15" placeholder="เช่น โด้" />
          </div>
          <button class="btn primary" onclick="joinGame()">เข้าสู่โลกออนไลน์ 🚀</button>
        </div>
      </div>
    `;
  } else {
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><div class="brand-logo">🌍</div><span>SHARED OPEN WORLD</span></div>
        <div style="font-size:13px; font-weight:bold; color:var(--gold);">
          ⭐ XP: ${players[myId].xp} | 💰 Gold: ${players[myId].gold}
        </div>
      </div>
      <div class="world-container">
        <canvas id="worldCanvas" width="1200" height="750"></canvas>
        <div class="hud-bar">
          <div style="font-size:11px; color:var(--muted); font-weight:800;">INVENTORY:</div>
          ${Object.keys(inventory).map(k => `
            <div class="token-slot ${inventory[k] > 0 ? 'filled' : ''}">
              ${k}
              <div class="badge-count">${inventory[k]}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    initCanvas();
  }

  if(activeGate) {
    app.innerHTML += renderModal();
  }
}

window.joinGame = function() {
  const name = document.getElementById('nameInput').value.trim();
  if(!name) { showToast('❌ กรุณาใส่ชื่อ'); return; }
  socket.emit('joinGame', { name });
  render();
};

function initCanvas() {
  const canvas = document.getElementById('worldCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  window.onkeydown = e => { keys[e.key.toLowerCase()] = true; };
  window.onkeyup = e => { keys[e.key.toLowerCase()] = false; };

  function loop() {
    if(!players[myId]) return;

    if(keys['w'] || keys['arrowup']) player.y -= player.speed;
    if(keys['s'] || keys['arrowdown']) player.y += player.speed;
    if(keys['a'] || keys['arrowleft']) player.x -= player.speed;
    if(keys['d'] || keys['arrowright']) player.x += player.speed;

    player.x = Math.max(30, Math.min(1170, player.x));
    player.y = Math.max(50, Math.min(720, player.y));

    socket.emit('playerMove', { x: player.x, y: player.y });

    // เช็คเก็บ Token
    tokens.forEach(t => {
      if(Math.hypot(player.x - t.x, player.y - t.y) < 35) {
        socket.emit('collectToken', t.id);
      }
    });

    // เช็ค Gate
    gates.forEach(g => {
      if(Math.hypot(player.x - g.x, player.y - g.y) < 55 && !activeGate && !g.solved) {
        activeGate = g;
        playerWorkspace = new Array(g.targetEquation.length).fill('');
        render();
      }
    });

    // --- DRAW ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#101d38';
    for(let x=0; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for(let y=0; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

    // Gates
    gates.forEach(g => {
      ctx.fillStyle = g.solved ? '#2fe69b' : '#ff993b';
      ctx.beginPath(); ctx.arc(g.x, g.y, 35, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(g.name, g.x, g.y - 45);
      ctx.fillText(g.solved ? 'CLEARED ✅' : 'GATE 🚪', g.x, g.y + 5);
    });

    // Tokens
    tokens.forEach(t => {
      ctx.fillStyle = '#38dbff';
      ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#050814'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(t.val, t.x, t.y + 5);
    });

    // All Players (Multiplayer)
    Object.values(players).forEach(p => {
      const isMe = p.id === myId;
      const px = isMe ? player.x : p.x;
      const py = isMe ? player.y : p.y;

      ctx.fillStyle = isMe ? '#ffd15c' : p.color;
      ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(p.name, px, py - 28);
    });

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function renderModal() {
  return `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>${activeGate.name}</h3>
        <p style="color:var(--muted); font-size:13px;">เรียงเบี้ยสัญลักษณ์เพื่อให้สมการสมดุล</p>
        <div class="equation-workspace">
          ${activeGate.targetEquation.map((_, i) => `
            <div class="eq-cell" onclick="removeFromWS(${i})">${playerWorkspace[i] || '_'}</div>
          `).join('')}
        </div>
        <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:20px;">
          ${Object.keys(inventory).map(k => `
            <button class="btn" style="background:#0c152a; color:var(--cyan); border:1px solid #24385e; padding:8px 14px;" onclick="addToWS('${k}')">${k} (${inventory[k]})</button>
          `).join('')}
        </div>
        <button class="btn primary" onclick="validateEq()">ตรวจสอบสมการ ⚔️</button>
        <button class="btn" style="background:transparent; color:var(--muted); margin-top:10px;" onclick="closeModal()">ปิดหน้าต่าง</button>
      </div>
    </div>
  `;
}

window.addToWS = function(token) {
  if(inventory[token] > 0) {
    const idx = playerWorkspace.findIndex(c => c === '');
    if(idx !== -1) {
      inventory[token]--;
      playerWorkspace[idx] = token;
      render();
    }
  }
};

window.removeFromWS = function(idx) {
  const t = playerWorkspace[idx];
  if(t) {
    inventory[t]++;
    playerWorkspace[idx] = '';
    render();
  }
};

window.validateEq = function() {
  const success = playerWorkspace.every((val, i) => val === activeGate.targetEquation[i]);
  if(success) {
    socket.emit('solveGate', { gateId: activeGate.id, success: true });
    showToast('🎉 สมการถูกต้อง! ปลดล็อกสำเร็จ!');
    closeModal();
  } else {
    showToast('❌ สมการยังไม่ถูกต้อง!');
  }
};

window.closeModal = function() {
  activeGate = null;
  render();
};

render();

})();
</script>
</body>
</html>
