<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MATH DUNGEON — Classroom RPG Online</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --bg:#070b16; --panel:#10182b; --panel2:#0c1324; --line:#263454;
  --text:#edf3ff; --muted:#91a0bd; --cyan:#48d7ff; --purple:#8c6cff;
  --gold:#ffd166; --green:#55e29a; --red:#ff5c7a; --orange:#ff9d4d;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; color:var(--text); font-family:Inter,Segoe UI,Tahoma,system-ui,sans-serif;
  background: radial-gradient(circle at 20% 10%,rgba(72,215,255,.08),transparent 25%),
              radial-gradient(circle at 80% 15%,rgba(140,108,255,.10),transparent 28%),
              linear-gradient(180deg,#050913,#091021 48%,#050913);
  overflow-x:hidden;
}
button,input,select{ font:inherit; }
button{ cursor:pointer; border:0; }
.app{ min-height:100vh; }
.hidden{ display:none!important; }
.topbar{
  position:sticky; top:0; z-index:30; display:flex; justify-content:space-between; align-items:center;
  padding:12px 18px; border-bottom:1px solid rgba(255,255,255,.06); background:rgba(5,9,19,.82); backdrop-filter:blur(16px);
}
.brand{ display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:.5px; }
.brand .logo{
  width:36px; height:36px; display:grid; place-items:center; border:1px solid #35547e; border-radius:12px;
  background:linear-gradient(135deg,#152543,#0b1630); box-shadow:0 0 22px rgba(72,215,255,.08);
}
.top-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.ghost-btn{ background:#0b1324; color:#c7d7f5; border:1px solid #263454; border-radius:10px; padding:9px 12px; cursor:pointer; }
.ghost-btn:hover{ border-color:#44629a; }
.page{ padding:24px; max-width:1500px; margin:auto; }
.grid{ display:grid; gap:18px; }
.card{
  background:linear-gradient(180deg, rgba(16,24,43,.94), rgba(10,16,30,.94));
  border:1px solid rgba(91,123,172,.18); border-radius:20px; box-shadow:var(--shadow);
}
.card.pad{ padding:20px; }
.hero{ padding:28px; display:flex; justify-content:space-between; gap:18px; align-items:flex-end; }
.eyebrow{ font-size:12px; color:#81a6cf; text-transform:uppercase; letter-spacing:1.5px; font-weight:800; }
h1,h2,h3{ margin:0 0 8px; }
.sub{ color:var(--muted); line-height:1.6; }
.badges{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.badge{ padding:6px 10px; border-radius:999px; font-size:12px; font-weight:800; border:1px solid #304666; background:#0b1427; color:#b8c9e8; }
.btn{ padding:12px 16px; border-radius:12px; font-weight:900; transition:.18s transform,.18s filter; }
.btn:hover{ transform:translateY(-1px); filter:brightness(1.08); }
.btn.primary{ color:white; background:linear-gradient(90deg,#7567ff,#2cc7e8); box-shadow:0 8px 25px rgba(72,215,255,.14); }
.btn.success{ background:linear-gradient(90deg,#26c986,#66e4a0); color:#052115; }
.btn.danger{ background:linear-gradient(90deg,#ff4e72,#ff7d5d); color:white; }
.btn.full{ width:100%; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; color:#8ea1c2; margin-bottom:6px; }
input{ width:100%; padding:12px 13px; color:#f4f7ff; background:#070e1c; border:1px solid #28395a; border-radius:11px; outline:none; }
.login-wrap{ min-height:100vh; display:grid; place-items:center; padding:24px; }
.login{ max-width:440px; width:100%; padding:28px; }
.logo-big{ width:84px; height:84px; margin:auto auto 14px; display:grid; place-items:center; font-size:42px; border-radius:24px; border:1px solid #31517f; background:linear-gradient(135deg,#14294a,#111731); }
.center{ text-align:center; }
.class-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:8px; }
.class-card{ padding:10px 6px; border-radius:12px; border:1px solid #233555; background:#0a1325; color:#b9c8df; text-align:center; cursor:pointer; }
.class-card.active{ border-color:#56cbe7; background:linear-gradient(180deg,#102b43,#0b1a31); }
.map{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; }
.stage{ min-height:150px; padding:16px; border-radius:18px; border:1px solid #293c5f; background:#0b1324; position:relative; color:#edf3ff; text-align:left; cursor:pointer; }
.stage.locked{ filter:grayscale(.45); opacity:.65; }
.stage.cleared{ border-color:#3c8f77; }
.quest{ font-size:20px; line-height:1.45; padding:20px; border:1px solid #334c74; background:#07101f; border-radius:16px; min-height:110px; display:flex; align-items:center; }
.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.key{ padding:14px; border-radius:12px; background:#0b1527; border:1px solid #2a3e61; color:white; font-size:20px; font-weight:900; cursor:pointer; }
.answer{ font-size:26px; letter-spacing:8px; text-align:center; }
table{ width:100%; border-collapse:collapse; margin-top:10px; }
th,td{ padding:12px; text-align:left; border-bottom:1px solid #202e49; font-size:14px; }
th{ color:var(--muted); font-size:12px; text-transform:uppercase; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); padding:11px 16px; border-radius:999px; background:#0c1528; border:1px solid #30486f; z-index:200; }
.toast.success{ border-color:#3d8f73; }
.toast.error{ border-color:#a94f62; }
@media (max-width:1100px){ .map{ grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
"use strict";

const socket = io();

let state = {
  profile: null,
  stages: [],
  completed: [],
  xp: 0, gold: 0
};

let currentStage = null;
let selectedClassId = 'mage';

const classes = [
  { id:"mage", name:"Mage", emoji:"🧙" },
  { id:"warrior", name:"Warrior", emoji:"⚔️" },
  { id:"archer", name:"Archer", emoji:"🏹" },
  { id:"knight", name:"Knight", emoji:"🛡️" },
  { id:"alchemist", name:"Alchemist", emoji:"🧪" }
];

socket.on('initGame', data => {
  state.stages = data.stages;
});

socket.on('currentAdminCodes', codes => {
  if(codes) {
    state.stages.forEach(s => { if(codes[s.id]) s.code = codes[s.id]; });
  }
});

function toast(msg, type="") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast " + (type || "");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.add("hidden"), 2200);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#039;" }[m]));
}

function shell(content) {
  document.getElementById("app").innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="logo">⚔️</div>
          <span>MATH DUNGEON ONLINE</span>
        </div>
        <div class="top-actions">
          ${state.profile ? `
            <button class="ghost-btn" onclick="switchMode('map')">🗺️ แผนที่</button>
            <button class="ghost-btn" onclick="openAdmin()">🔐 ครู (จัดการรายชื่อ)</button>
          ` : ""}
        </div>
      </div>
      ${content}
    </div>
  `;
}

window.switchMode = function(mode) {
  if(mode === 'map') renderMap();
  else if(mode === 'admin') renderAdmin();
};

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <div class="card login">
        <div class="logo-big">🏰</div>
        <div class="center">
          <div class="eyebrow">Classroom RPG Online</div>
          <h1>Math Dungeon</h1>
          <div class="sub">ใส่ชื่อและรหัสผ่านเพื่อบันทึกคะแนนของคุณ</div>
        </div>
        <div class="section" style="margin-top:16px;">
          <div class="field">
            <label>ชื่อผู้เล่น</label>
            <input id="name" maxlength="20" placeholder="เช่น ภากร" />
          </div>
          <div class="field">
            <label>รหัสผ่าน (สำหรับเข้าสู่ระบบครั้งต่อไป)</label>
            <input id="password" type="password" maxlength="20" placeholder="รหัสผ่าน" />
          </div>
        </div>
        <div class="section">
          <div class="field"><label>เลือก Class ตัวละคร</label></div>
          <div class="class-grid">
            ${classes.map((c,i) => `
              <button class="class-card ${i===0?'active':''}" onclick="selectClass('${c.id}', this)">
                <span style="font-size:24px;">${c.emoji}</span>
                <div style="font-size:11px;">${c.name}</div>
              </button>
            `).join("")}
          </div>
        </div>
        <div class="section" style="margin-top:20px;">
          <button class="btn primary full" onclick="submitAuth()">⚔️ เข้าสู่เกม / สมัครสมาชิก</button>
        </div>
      </div>
    </div>
  `;
}

window.selectClass = function(id, el) {
  document.querySelectorAll('.class-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedClassId = id;
};

window.submitAuth = function() {
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value.trim();
  if(!name || !password) { toast("กรุณากรอกชื่อและรหัสผ่าน", "error"); return; }

  socket.emit('authPlayer', { name, password, classId: selectedClassId });
};

socket.on('authResult', data => {
  if(data.success) {
    state.profile = data.profile;
    state.xp = data.profile.xp;
    state.gold = data.profile.gold;
    state.completed = data.profile.completed;
    socket.emit('requestAdminCodes');
    renderMap();
    toast(`🎉 ยินดีต้อนรับคุณ ${state.profile.name}`, "success");
  } else {
    toast(data.msg, "error");
  }
});

function renderMap() {
  shell(`
    <div class="page">
      <div class="card hero">
        <div>
          <div class="eyebrow">PLAYER: ${esc(state.profile.name)}</div>
          <h1>เส้นทางสู่ปราสาทสมการ</h1>
          <div class="sub">คะแนนสะสม: ${state.xp} XP | ทอง: ${state.gold} G</div>
        </div>
      </div>
      <div class="section card pad" style="margin-top:20px;">
        <h3>🗺️ แผนที่ฐานการเรียนรู้</h3>
        <div class="map section" style="margin-top:14px;">
          ${state.stages.map((s, i) => {
            const cleared = state.completed.includes(s.id);
            const unlocked = i === 0 || state.completed.includes(state.stages[i-1].id);
            return `
              <button class="stage ${(!unlocked && !cleared)?'locked':''} ${cleared?'cleared':''}" ${unlocked||cleared ? `onclick="openStage(${s.id})"`:''}>
                <div style="font-size:28px;">${s.icon || '🧩'}</div>
                <div style="position:absolute; top:12px; right:12px;">${cleared?'✅':unlocked?'🟡':'🔒'}</div>
                <h3 style="margin-top:8px;">BASE ${String(s.id).padStart(2,"0")}</h3>
                <div>${esc(s.name)}</div>
                <small style="color:var(--muted);">${s.difficulty} • +${s.xp} XP</small>
              </button>
            `;
          }).join("")}
        </div>
      </div>
    </div>
  `);
}

window.openStage = function(id) {
  currentStage = state.stages.find(s => s.id === id);
  if(!currentStage) return;
  shell(`
    <div class="page">
      <div class="card hero">
        <div>
          <div class="eyebrow">BASE ${currentStage.id}</div>
          <h1>${esc(currentStage.name)}</h1>
          <div class="sub">กรอกรหัสจากครูเพื่อปลดล็อกฐานนี้</div>
        </div>
      </div>
      <div class="section grid" style="grid-template-columns:1fr 1fr; margin-top:20px;">
        <div class="card pad">
          <h2>📜 HINT</h2>
          <div class="quest">${esc(currentStage.hint || 'วิเคราะห์โจทย์ให้รอบคอบ')}</div>
        </div>
        <div class="card pad">
          <h2>🔐 CONSOLE</h2>
          <input id="answer" class="answer" readonly placeholder="_ _ _" style="margin:10px 0;" />
          <div class="keypad">
            ${[1,2,3,4,5,6,7,8,9,"C",0,"✓"].map(v => `
              <button class="key" onclick="pressKey('${v}')">${v}</button>
            `).join("")}
          </div>
          <div class="section" style="margin-top:14px;">
            <button class="btn primary full" onclick="submitAnswer()">⚔️ ยืนยันรหัส</button>
          </div>
        </div>
      </div>
    </div>
  `);
};

window.pressKey = function(v) {
  const inp = document.getElementById("answer");
  if(!inp) return;
  if(v === "C") inp.value = "";
  else if(v === "✓") submitAnswer();
  else if(inp.value.length < 10) inp.value += v;
};

window.submitAnswer = function() {
  const val = document.getElementById("answer").value.trim();
  if(val === String(currentStage.code)) {
    if(!state.completed.includes(currentStage.id)) state.completed.push(currentStage.id);
    state.xp += currentStage.xp;
    state.gold += currentStage.gold;
    
    socket.emit('updateProgress', {
      name: state.profile.name,
      xp: state.xp,
      gold: state.gold,
      completed: state.completed
    });

    toast(`🔓 ปลดล็อก ${currentStage.name} สำเร็จ!`, "success");
    renderMap();
  } else {
    toast("❌ รหัสผ่านไม่ถูกต้อง ลองตรวจสอบอีกครั้ง", "error");
  }
};

/* --- TEACHER ADMIN MANAGEMENT PANEL --- */
window.openAdmin = function() {
  const pass = prompt("ใส่รหัสผ่านครู (ค่าเริ่มต้น: admin):");
  if(pass === "admin") {
    socket.emit('adminGetStudents');
  } else {
    toast("❌ รหัสผ่านไม่ถูกต้อง", "error");
  }
};

socket.on('adminStudentListData', students => {
  renderAdminPanel(students);
});

socket.on('adminActionMsg', msg => {
  toast(msg, "success");
});

function renderAdminPanel(students) {
  shell(`
    <div class="page">
      <div class="card hero">
        <div>
          <div class="eyebrow">TEACHER PANEL</div>
          <h1>👥 จัดการรายชื่อนักเรียนและเช็คสถานะออฟไลน์</h1>
        </div>
      </div>
      <div class="section card pad" style="margin-top:20px;">
        <h3>รายชื่อผู้เรียนทั้งหมดในระบบ</h3>
        <table>
          <thead>
            <tr>
              <th>ชื่อนักเรียน</th>
              <th>Class</th>
              <th>XP สะสม</th>
              <th>สถานะ / ไม่ได้ออน</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody>
            ${students.length === 0 ? `<tr><td colspan="5" style="text-align:center; color:var(--muted);">ยังไม่มีนักเรียนลงทะเบียนในระบบ</td></tr>` : 
              students.map(s => `
                <tr>
                  <td><b>${esc(s.name)}</b></td>
                  <td>${s.classId}</td>
                  <td>${s.xp} XP</td>
                  <td>${s.offlineDays === 0 ? '<span style="color:var(--green);">🟢 ออนไลน์วันนี้</span>' : `<span style="color:var(--red);">🔴 ไม่ได้ออน ${s.offlineDays} วัน</span>`}</td>
                  <td>
                    <button class="btn danger" style="padding:6px 12px; font-size:12px;" onclick="deleteStudent('${esc(s.name)}')">🗑️ ลบรายชื่อ</button>
                  </td>
                </tr>
              `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `);
}

window.deleteStudent = function(name) {
  if(confirm(`คุณต้องการลบรายชื่อของ "${name}" ออกจากระบบใช่หรือไม่?`)) {
    socket.emit('adminDeleteStudent', name);
  }
};

renderLogin();
})();
</script>
</body>
</html>
