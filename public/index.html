<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Math Dungeon PvP Edition</title>
<script src="/socket.io/socket.io.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700;900&display=swap');
/* CSS พื้นฐานเดิม (ย่อไว้เพื่อความกระชับ) */
:root { --bg:#05070f; --cyan:#38bdf8; --red:#f43f5e; --green:#10b981; --gold:#fbbf24; }
* { box-sizing: border-box; font-family: 'Kanit'; user-select: none; }
body { margin: 0; overflow: hidden; background: var(--bg); color: #fff; }
#game { position: fixed; inset: 0; }
.btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
.btn.primary { background: linear-gradient(135deg, #6366f1, #06b6d4); color: white; }

/* PVP Button */
.pvp-btn { position: fixed; right: 16px; bottom: 80px; background: linear-gradient(135deg, #f43f5e, #be123c); color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 900; font-size: 16px; border: 2px solid #fda4af; box-shadow: 0 4px 15px rgba(244,63,94,0.5); z-index: 10; cursor: pointer; }

/* BATTLE ARENA OVERLAY */
#battleScreen { position: fixed; inset: 0; background: #070a14; z-index: 50; display: none; flex-direction: column; }
.battle-header { text-align: center; font-size: 24px; font-weight: 900; color: var(--gold); padding: 10px; background: rgba(0,0,0,0.5); letter-spacing: 2px; }
.arena { display: flex; justify-content: space-between; padding: 20px; flex: 1; align-items: center; }
.fighter { width: 45%; background: rgba(30,41,59,0.7); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
.f-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.bar { width: 100%; height: 20px; background: #0f172a; border-radius: 10px; overflow: hidden; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.2); }
.hp-fill { height: 100%; background: linear-gradient(90deg, #e11d48, #f43f5e); transition: width 0.3s; }
.en-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width 0.3s; }

.combat-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; pointer-events: none; }
.dmg-text { font-size: 40px; font-weight: 900; color: #f43f5e; text-shadow: 0 4px 15px rgba(0,0,0,0.8); opacity: 0; transform: translateY(20px); transition: 0.3s; }
.dmg-text.show { opacity: 1; transform: translateY(-20px); }

/* BATTLE DASHBOARD */
.battle-dash { background: #0f172a; padding: 20px; border-top: 2px solid #334155; display: flex; flex-direction: column; align-items: center; }
.question-box { font-size: 32px; font-weight: 900; color: #fff; background: #1e293b; padding: 10px 40px; border-radius: 12px; margin-bottom: 16px; border: 2px solid var(--cyan); }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 300px; }
.num-btn { background: #334155; color: #fff; border: none; padding: 15px; font-size: 24px; font-weight: 700; border-radius: 10px; cursor: pointer; }
.num-btn:active { background: #475569; }
.num-btn.clear { background: #be123c; }
.num-btn.submit { background: #059669; }
.ans-display { font-size: 24px; letter-spacing: 4px; height: 35px; color: var(--gold); margin-bottom: 10px; }

/* Result Modal */
#resultModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 60; display: none; place-items: center; }
.result-box { text-align: center; background: #1e293b; padding: 40px; border-radius: 20px; border: 2px solid var(--gold); }
.result-title { font-size: 48px; font-weight: 900; margin: 0 0 20px 0; }
</style>
</head>
<body>

    <!-- UI เดิมเบื้องต้น -->
    <div id="nameModal" style="position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;">
        <div style="background:#1e293b;padding:20px;border-radius:10px;text-align:center;">
            <h2>เข้าเกม</h2>
            <input id="nameInput" placeholder="ชื่อ" style="padding:10px;font-size:16px;">
            <button onclick="joinGame()" class="btn primary">เริ่มเกม</button>
        </div>
    </div>

    <!-- ปุ่มเรียก PvP -->
    <button class="pvp-btn" onclick="startMatchmaking()">⚔️ QUICK DUEL</button>

    <!-- หน้าจอต่อสู้ -->
    <div id="battleScreen">
        <div class="battle-header">🔥 MATH BATTLE 🔥</div>
        <div class="arena">
            <div class="fighter" id="myFighter">
                <div class="f-name">YOU</div>
                <div class="bar"><div class="hp-fill" id="myHp"></div></div>
                <div class="bar" style="height:10px;"><div class="en-fill" id="myEn"></div></div>
            </div>
            
            <div class="fighter" id="oppFighter" style="text-align:right;">
                <div class="f-name" id="oppName">OPPONENT</div>
                <div class="bar"><div class="hp-fill" id="oppHp"></div></div>
                <div class="bar" style="height:10px;"><div class="en-fill" id="oppEn"></div></div>
            </div>

            <div class="combat-center">
                <div class="dmg-text" id="dmgText">-25</div>
            </div>
        </div>

        <div class="battle-dash">
            <div class="question-box" id="battleQuestion">รอโจทย์...</div>
            <div class="ans-display" id="ansDisplay"></div>
            <div class="numpad">
                <button class="num-btn" onclick="typeNum(1)">1</button>
                <button class="num-btn" onclick="typeNum(2)">2</button>
                <button class="num-btn" onclick="typeNum(3)">3</button>
                <button class="num-btn" onclick="typeNum(4)">4</button>
                <button class="num-btn" onclick="typeNum(5)">5</button>
                <button class="num-btn" onclick="typeNum(6)">6</button>
                <button class="num-btn" onclick="typeNum(7)">7</button>
                <button class="num-btn" onclick="typeNum(8)">8</button>
                <button class="num-btn" onclick="typeNum(9)">9</button>
                <button class="num-btn clear" onclick="typeNum('C')">C</button>
                <button class="num-btn" onclick="typeNum(0)">0</button>
                <button class="num-btn submit" onclick="submitAns()">✓</button>
            </div>
        </div>
    </div>

    <!-- สรุปผล -->
    <div id="resultModal">
        <div class="result-box">
            <h1 class="result-title" id="resultTitle">VICTORY</h1>
            <button class="btn primary" onclick="closeBattle()">กลับสู่แผนที่</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myRole = '';
        let currentAns = '';

        function joinGame() {
            socket.emit('setupPlayer', { name: document.getElementById('nameInput').value || 'Hero' });
            document.getElementById('nameModal').style.display = 'none';
        }

        function startMatchmaking() {
            socket.emit('findMatch');
            document.querySelector('.pvp-btn').innerText = '⏳ SEARCHING...';
        }

        // เริ่มต่อสู้
        socket.on('battleStart', data => {
            document.getElementById('battleScreen').style.display = 'flex';
            document.querySelector('.pvp-btn').style.display = 'none';
            myRole = data.me;
            
            document.getElementById('oppName').innerText = data.opponent.name;
            document.getElementById('myHp').style.width = '100%';
            document.getElementById('oppHp').style.width = '100%';
            document.getElementById('myEn').style.width = '0%';
            document.getElementById('oppEn').style.width = '0%';
            
            document.getElementById('battleQuestion').innerText = data.match.question.text;
            currentAns = ''; document.getElementById('ansDisplay').innerText = '';
        });

        // Numpad Logic
        function typeNum(n) {
            if(n === 'C') currentAns = '';
            else if(currentAns.length < 5) currentAns += n;
            document.getElementById('ansDisplay').innerText = currentAns;
        }

        function submitAns() {
            if(currentAns === '') return;
            socket.emit('submitBattleAnswer', currentAns);
            currentAns = ''; document.getElementById('ansDisplay').innerText = '';
        }

        // อัปเดตการโจมตี
        socket.on('battleUpdate', data => {
            if (data.action === 'HIT') {
                const isMeAttacking = (data.attacker === myRole);
                const oppRole = myRole === 'p1' ? 'p2' : 'p1';
                
                // อัปเดตหลอดเลือด
                document.getElementById('myHp').style.width = data.match[myRole].hp + '%';
                document.getElementById('oppHp').style.width = data.match[oppRole].hp + '%';
                document.getElementById('myEn').style.width = data.match[myRole].energy + '%';
                document.getElementById('oppEn').style.width = data.match[oppRole].energy + '%';

                // แสดง Damage Animation
                const dt = document.getElementById('dmgText');
                dt.innerText = `-${data.damage} HP`;
                dt.style.color = isMeAttacking ? '#10b981' : '#f43f5e'; // สีเขียวถ้าเราตี สีแดงถ้าโดนตี
                dt.classList.add('show');
                setTimeout(() => dt.classList.remove('show'), 800);
            } else if (data.action === 'MISS') {
                // เอฟเฟกต์ตอบผิด
                const qb = document.getElementById('battleQuestion');
                qb.style.borderColor = '#f43f5e';
                setTimeout(() => qb.style.borderColor = '#38bdf8', 300);
            }
        });

        socket.on('nextQuestion', q => {
            document.getElementById('battleQuestion').innerText = q.text;
        });

        socket.on('battleEnd', data => {
            document.getElementById('resultModal').style.display = 'grid';
            const rt = document.getElementById('resultTitle');
            rt.innerText = data.result;
            rt.style.color = data.result === 'VICTORY' ? '#fbbf24' : '#94a3b8';
        });

        function closeBattle() {
            document.getElementById('resultModal').style.display = 'none';
            document.getElementById('battleScreen').style.display = 'none';
            const pvpBtn = document.querySelector('.pvp-btn');
            pvpBtn.style.display = 'block';
            pvpBtn.innerText = '⚔️ QUICK DUEL';
        }
    </script>
</body>
</html>
